# duplistatus docker-compose.yml
services:
  duplistatus:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION}
      network: host
    image: wsjbr/duplistatus:${VERSION}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    container_name: duplistatus
    restart: unless-stopped
    ports:
      - "9666:9666"
    volumes:
      - duplistatus_data:/app/data
    # environment:
    #   IP_TRUSTED_PROXIES: "10.0.0.0/8"
    #   ADMIN_IP_ALLOWLIST_ENABLED: "false"
    #   ADMIN_IP_ALLOWLIST: "192.168.1.0/24"
    #   EXTERNAL_API_IP_ALLOWLIST_ENABLED: "false"
    #   EXTERNAL_API_IP_ALLOWLIST: "192.168.1.0/24"
    networks:
      - duplistatus_network

networks:
  duplistatus_network:
    driver: bridge

volumes:
  duplistatus_data:
    name: duplistatus_data 
