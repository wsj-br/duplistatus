peerDependencyRules:
  allowedVersions:
    webpack: '5'
    # eslint-plugin-react / import / jsx-a11y still declare eslint ^9 only.
    # Runtime is ESLint 10; react version is pinned in eslint.config.mjs so the
    # plugin's detect path (removed context.getFilename) is never used.
    eslint: '10'

allowedDeprecatedVersions:
  prebuild-install: 7.1.3
  whatwg-encoding: 3.1.1

allowBuilds:
  '@swc/core': true
  '@tailwindcss/oxide': true
  bcrypt: true
  better-sqlite3: true
  core-js: true
  core-js-pure: true
  esbuild: true
  playwright: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - lucide-react@1.21.0 || 1.40.0
  - node-cron@4.4.1
  - js-yaml@4.1.2
  - http-proxy-middleware@3.0.6
  - ai-i18n-tools
  - i18next@26.4.2
  - postcss@8.5.28
  - '@ai-sdk/gateway@4.0.74'
  - ai@7.0.92
